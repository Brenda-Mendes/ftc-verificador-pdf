# Caminho da pasta que contem os PDFs a serem processados.
# Pode ser absoluto ou relativo a raiz do projeto.
# Exemplo absoluto: C:/Users/seu.usuario/Documents/pdfs
# Exemplo relativo (pasta pdfs na raiz do projeto): pdfs
pdf.entrada.dir=arquivos/pdfs/in
pdf.saida.dir=arquivos/pdfs/out

# Caminho do arquivo XLSX que contem a coluna "Conta".
# Pode ser absoluto ou relativo a raiz do projeto.
# Pode apontar diretamente para o .xlsx ou para uma pasta contendo exatamente um .xlsx.
# Exemplo relativo (pasta): arquivos/xls
xls.dir=arquivos/xls
